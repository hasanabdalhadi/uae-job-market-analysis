name: Prepare UAE Job Market Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare UAE technology dataset
        run: python prepare_data.py

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/uae_tech_jobs_clean.csv
          git add data/arab_jobs_raw.csv
          git diff --cached --quiet || git commit -m "Generate UAE technology job market dataset"
          git push
