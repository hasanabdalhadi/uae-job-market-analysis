name: Update HJMI UAE Job Market Data

on:
  # Allows manual runs from GitHub Actions
  workflow_dispatch:

  # Automatic daily update
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-job-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and prepare UAE technology jobs
        run: |
          python prepare_data.py

      - name: Show generated dataset information
        run: |
          echo "Generated data files:"
          ls -lh data/
          echo ""
          echo "Clean dataset rows:"
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/uae_tech_jobs_clean.csv")
          print(f"Rows: {len(df):,}")
          print(f"Columns: {len(df.columns):,}")
          print(df[["job_title", "company", "location"]].head())
          PY

      - name: Commit updated job market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Automatically update UAE job market data"
            git push
          fi
