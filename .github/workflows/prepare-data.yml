name: Update HJMI UAE Job Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-job-data:
    runs-on: ubuntu-latest

    env:
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify API configuration
        run: |
          python - <<'PY'
          import os

          if not os.getenv("JOOBLE_API_KEY"):
              raise RuntimeError(
                  "JOOBLE_API_KEY GitHub Secret is missing."
              )

          print("JOOBLE_API_KEY is configured.")
          PY

      - name: Fetch and prepare UAE technology jobs
        run: |
          python prepare_data.py

      - name: Show generated dataset information
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          file = Path("data/uae_tech_jobs_clean.csv")

          if not file.exists():
              raise RuntimeError(
                  "uae_tech_jobs_clean.csv was not generated."
              )

          df = pd.read_csv(file)

          if df.empty:
              raise RuntimeError(
                  "Generated dataset is empty."
              )

          print(f"Rows: {len(df):,}")
          print(f"Columns: {len(df.columns):,}")
          print()

          columns = [
              column
              for column in [
                  "job_title",
                  "company",
                  "location",
                  "salary",
                  "publication_date",
                  "source",
              ]
              if column in df.columns
          ]

          print(df[columns].head(10).to_string(index=False))
          PY

      - name: Sync latest main branch
        run: |
          git pull --rebase origin main

      - name: Commit updated job market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Automatically update HJMI UAE job market data"
            git push origin main
          fi
